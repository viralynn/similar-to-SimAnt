<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Similar to SimAnt</title>
</head>
<body>
    <h1>Similar to SimAnt</h1>
    <p>Day: <span id="day">1</span></p>
    <p>Queen Health: <span id="queen-health">100</span></p>
    <p>Food: <span id="food">50</span></p>
    <p>Ants: <span id="ants">10</span> <span id="starvation-warning" style="color: red;"> </span></p>
    <select id="food-consumption-settings">
        <option value="1">Low (1 food per ant)</option>
        <option value="2" selected>Medium (2 food per ant)</option>
        <option value="3">High (3 food per ant)</option>
    </select>
    <button id="end-day">End Day</button>

    <script src="script.js"></script>
</body>
</html>
